name: 临时探测令牌（用完即删）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 测试 agentrouter 令牌鉴权
        env:
          PROXY: ${{ secrets.PROBE_PROXY }}
          TOKEN: ${{ secrets.PROBE_TOKEN }}
        run: |
          URL=https://agentrouter.org/api/user/self

          echo "--- 1. self + Bearer"
          curl -sS -o /tmp/b1 -w '    status=%{http_code} ct=%{content_type}\n' \
            --max-time 40 --proxy "$PROXY" -H "Authorization: Bearer $TOKEN" "$URL" || echo "    请求失败"
          echo "    body=$(head -c 220 /tmp/b1 2>/dev/null)"

          echo "--- 2. self + Bearer + new-api-user: 809242"
          curl -sS -o /tmp/b2 -w '    status=%{http_code} ct=%{content_type}\n' \
            --max-time 40 --proxy "$PROXY" -H "Authorization: Bearer $TOKEN" -H "new-api-user: 809242" "$URL" || echo "    请求失败"
          echo "    body=$(head -c 220 /tmp/b2 2>/dev/null)"

          echo "--- 3. self + raw token（无 Bearer 前缀）"
          curl -sS -o /tmp/b3 -w '    status=%{http_code} ct=%{content_type}\n' \
            --max-time 40 --proxy "$PROXY" -H "Authorization: $TOKEN" "$URL" || echo "    请求失败"
          echo "    body=$(head -c 220 /tmp/b3 2>/dev/null)"

          echo "--- 4. self 无令牌（基线）"
          curl -sS -o /tmp/b4 -w '    status=%{http_code} ct=%{content_type}\n' \
            --max-time 40 --proxy "$PROXY" "$URL" || echo "    请求失败"
          echo "    body=$(head -c 220 /tmp/b4 2>/dev/null)"

          echo "--- 5. access_tokens + Bearer"
          curl -sS -o /tmp/b5 -w '    status=%{http_code} ct=%{content_type}\n' \
            --max-time 40 --proxy "$PROXY" -H "Authorization: Bearer $TOKEN" \
            https://agentrouter.org/api/user/access_tokens || echo "    请求失败"
          echo "    body=$(head -c 220 /tmp/b5 2>/dev/null)"
