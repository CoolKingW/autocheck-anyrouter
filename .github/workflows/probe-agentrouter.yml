name: 临时探测 agentrouter（用完即删）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Playwright
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install chromium --with-deps

      - name: 探测 agentrouter.org
        run: |
          python - <<'PY'
          import asyncio

          from playwright.async_api import async_playwright

          UA = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
              '(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          )
          BASE = 'https://agentrouter.org'


          async def show(label, resp):
              body = (await resp.body()).decode('utf-8', 'replace')
              print(f'--- {label}')
              print(f'    status={resp.status} ct={resp.headers.get("content-type", "")}')
              print(f'    server={resp.headers.get("server", "")} tengine={resp.headers.get("x-tengine-error", "")}')
              print(f'    len={len(body)} head={body[:160]!r}')


          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox', '--disable-dev-shm-usage'],
                  )
                  ctx = await browser.new_context(user_agent=UA)
                  page = await ctx.new_page()

                  try:
                      resp = await page.goto(f'{BASE}/login', wait_until='networkidle', timeout=60000)
                      print(f'/login status={resp.status if resp else None} title={await page.title()!r}')
                      html = await page.content()
                      markers = [
                          'acw_sc__v2', 'nc-container', '请进行验证', 'Turnstile',
                          'verify you are human', 'nocaptcha', 'slider', 'captcha',
                      ]
                      print('login markers:', {m: (m in html) for m in markers})
                      print('cookies:', [(c['name'], len(c['value'])) for c in await ctx.cookies()])
                  except Exception as e:
                      print(f'/login EXCEPTION {type(e).__name__}: {e}')

                  req = ctx.request
                  gets = [
                      ('GET /api/status', '/api/status'),
                      ('GET /api/user/self (no auth)', '/api/user/self'),
                      ('GET /api/user/self (bogus bearer)', '/api/user/self'),
                  ]
                  for label, path in gets:
                      headers = {'Accept': 'application/json'}
                      if 'bearer' in label:
                          headers['Authorization'] = 'Bearer sk-probe-bogus'
                      try:
                          resp = await req.get(f'{BASE}{path}', headers=headers, timeout=30000)
                          await show(label, resp)
                      except Exception as e:
                          print(f'--- {label}\n    EXCEPTION {type(e).__name__}: {e}')

                  for label, path in [
                      ('POST /api/user/sign_in (no auth)', '/api/user/sign_in'),
                      ('POST /api/user/login (empty)', '/api/user/login'),
                  ]:
                      try:
                          resp = await req.post(
                              f'{BASE}{path}',
                              headers={'Accept': 'application/json', 'Content-Type': 'application/json'},
                              data='{}',
                              timeout=30000,
                          )
                          await show(label, resp)
                      except Exception as e:
                          print(f'--- {label}\n    EXCEPTION {type(e).__name__}: {e}')

                  await browser.close()


          asyncio.run(main())
          PY
