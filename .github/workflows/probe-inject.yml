name: 临时探测 cookie 注入（用完即删）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 /v1 通道是否同样被 WAF 拦截
        env:
          TOKEN: ${{ secrets.PROBE_TOKEN }}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          for p in "/v1/models" "/v1/dashboard/billing/subscription" "/api/status"; do
            out=$(curl -sS --max-time 25 -o /tmp/b -w '%{http_code}|%{content_type}|%{size_download}' \
              -H "Authorization: Bearer $TOKEN" -H "User-Agent: $UA" -H 'Accept: application/json' \
              "https://agentrouter.org$p" 2>/dev/null || echo 'ERR||')
            echo "$p -> $out"
            echo "    head=$(head -c 140 /tmp/b 2>/dev/null | tr -d '\n')"
          done
