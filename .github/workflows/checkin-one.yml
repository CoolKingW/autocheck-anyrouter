name: 单账号签到（临时）

on:
  workflow_dispatch:

jobs:
  checkin-one:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      TZ: ${{ secrets.TZ }}
      TIMESTAMP_FORMAT: ${{ secrets.TIMESTAMP_FORMAT }}
      # 只注入需要补签的那一个账号，其余账号不参与，避免多余请求打到代理
      ANYROUTER_ACCOUNT_AGENT_809398: ${{ secrets.ANYROUTER_ACCOUNT_AGENT_809398 }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🔧 安装 Mise
        uses: jdx/mise-action@v4
        with:
          cache_key: "{{default}}-${{ hashFiles('pyproject.toml') }}"

      - name: ⚙️ 安装依赖
        run: mise run install

      - name: 🎭 配置 Playwright 环境
        uses: ./.github/actions/setup-playwright
        id: playwright-setup

      - name: 🚀 单账号签到
        run: mise run checkin
