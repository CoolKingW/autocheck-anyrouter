name: 临时探测（用完即删）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Playwright
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install chromium --with-deps

      - name: 探测 API 鉴权行为
        run: |
          python - <<'PY'
          import asyncio

          from playwright.async_api import async_playwright

          UA = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
              '(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          )
          BASE = 'https://anyrouter.top'


          async def show(label, resp):
              body = (await resp.body()).decode('utf-8', 'replace')
              print(f'--- {label}')
              print(f'    status={resp.status} ct={resp.headers.get("content-type", "")}')
              print(f'    tengine={resp.headers.get("x-tengine-error", "")}')
              print(f'    body={body[:200]!r}')


          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox', '--disable-dev-shm-usage'],
                  )
                  ctx = await browser.new_context(user_agent=UA)
                  page = await ctx.new_page()
                  await page.goto(f'{BASE}/login', wait_until='networkidle', timeout=60000)
                  print('WAF cookies:', [(c['name'], len(c['value'])) for c in await ctx.cookies()])

                  req = ctx.request
                  bearer = {'Authorization': 'Bearer sk-probe-bogus'}

                  gets = [
                      ('GET /api/status', '/api/status', {}),
                      ('GET /api/user/__probe_missing__', '/api/user/__probe_missing__', {}),
                      ('GET /api/user/self (no auth)', '/api/user/self', {}),
                      ('GET /api/user/self (bogus bearer)', '/api/user/self', bearer),
                      ('GET /api/user/access_tokens', '/api/user/access_tokens', {}),
                      ('GET /api/user/access_tokens/catalog', '/api/user/access_tokens/catalog', {}),
                  ]
                  for label, path, headers in gets:
                      try:
                          resp = await req.get(
                              f'{BASE}{path}',
                              headers={'Accept': 'application/json', **headers},
                              timeout=30000,
                          )
                          await show(label, resp)
                      except Exception as e:
                          print(f'--- {label}\n    EXCEPTION {type(e).__name__}: {e}')

                  posts = [
                      ('POST /api/user/sign_in (no auth)', '/api/user/sign_in', {}),
                      ('POST /api/user/sign_in (bogus bearer)', '/api/user/sign_in', bearer),
                      ('POST /api/user/login (empty body)', '/api/user/login', {}),
                  ]
                  for label, path, headers in posts:
                      try:
                          resp = await req.post(
                              f'{BASE}{path}',
                              headers={
                                  'Accept': 'application/json',
                                  'Content-Type': 'application/json',
                                  **headers,
                              },
                              data='{}',
                              timeout=30000,
                          )
                          await show(label, resp)
                      except Exception as e:
                          print(f'--- {label}\n    EXCEPTION {type(e).__name__}: {e}')

                  await browser.close()


          asyncio.run(main())
          PY
