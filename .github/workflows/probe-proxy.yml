name: 临时探测代理（用完即删）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检测是否支持 HTTP 代理 + Playwright 走代理
        env:
          PROXY: ${{ secrets.PROBE_SOCKS }}
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install chromium --with-deps

          python - <<'PY'
          import asyncio
          import os
          from urllib.parse import unquote, urlparse

          from playwright.async_api import async_playwright

          u = urlparse(os.environ['PROXY'])
          host, port = u.hostname, u.port or 1080
          user, pwd = unquote(u.username or ''), unquote(u.password or '')
          print(f'proxy host={host} port={port} user_len={len(user)} pwd_len={len(pwd)}')

          UA = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
              '(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          )
          BASE = 'https://agentrouter.org'


          async def main():
              async with async_playwright() as p:
                  # 先试 HTTP 代理模式（Chromium 不支持 SOCKS5 认证，但支持 HTTP 代理认证）
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox', '--disable-dev-shm-usage'],
                      proxy={
                          'server': f'http://{host}:{port}',
                          'username': user,
                          'password': pwd,
                      },
                  )
                  ctx = await browser.new_context(user_agent=UA)
                  page = await ctx.new_page()

                  try:
                      resp = await page.goto(f'{BASE}/login', wait_until='networkidle', timeout=60000)
                      print(f'/login http={resp.status if resp else None} title={await page.title()!r}')
                      html = await page.content()
                      markers = ['nc-container', '请进行验证', 'aliyun_waf_aa', 'acw_sc__v2', 'Turnstile']
                      print('markers:', {m: (m in html) for m in markers})
                      print('cookies:', [(c['name'], len(c['value'])) for c in await ctx.cookies()])
                  except Exception as e:
                      print(f'/login EXCEPTION {type(e).__name__}: {e}')

                  for label, path in [
                      ('GET /api/status', '/api/status'),
                      ('GET /api/user/self', '/api/user/self'),
                  ]:
                      try:
                          r = await ctx.request.get(f'{BASE}{path}', headers={'Accept': 'application/json'}, timeout=30000)
                          body = (await r.body()).decode('utf-8', 'replace')
                          print(f'{label} -> {r.status} {r.headers.get("content-type", "")} len={len(body)}')
                          print(f'    head={body[:200]!r}')
                      except Exception as e:
                          print(f'{label} EXCEPTION {type(e).__name__}: {e}')

                  # 顺便测一下出口 IP
                  try:
                      r = await ctx.request.get('https://api.ipify.org', timeout=30000)
                      print('egress ip =', (await r.body()).decode())
                  except Exception as e:
                      print(f'ip EXCEPTION {type(e).__name__}: {e}')

                  await browser.close()


          asyncio.run(main())
          PY
