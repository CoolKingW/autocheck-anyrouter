name: 临时探测 runner 出口（用完即删）

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 探测 agentrouter 可达性
        shell: bash
        run: |
          echo "runner=${{ matrix.os }}"
          echo "egress_ip=$(curl -sS --max-time 20 https://api.ipify.org || echo fail)"
          for path in /api/status /api/user/self; do
            out=$(curl -sS --max-time 25 -o /tmp/body -w '%{http_code}|%{content_type}' "https://agentrouter.org$path" 2>/dev/null || echo 'ERR|')
            echo "$path -> $out len=$(wc -c < /tmp/body 2>/dev/null || echo 0)"
            echo "    head=$(head -c 100 /tmp/body 2>/dev/null | tr -d '\n')"
          done
